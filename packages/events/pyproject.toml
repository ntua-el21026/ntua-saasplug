[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "saasplug-events"
version = "0.1.0"
description = "Shared saasPlug RabbitMQ event contracts and helper primitives"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2,<3",
  "pika>=1.3,<2",
]

[tool.setuptools.packages.find]
include = ["saasplug_events*"]
