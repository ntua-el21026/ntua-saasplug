      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      PROVIDER_CODE: bluePlug
      PROVIDER_BASE_URL: ${BLUE_PROVIDER_BASE_URL:-https://davinci.softlab.ntua.gr/saas26/bluePlug/api}
      PROVIDER_API_TIMEOUT_SECONDS: ${PROVIDER_API_TIMEOUT_SECONDS:-10}
      PROVIDER_AUTH_SCHEME: ${PROVIDER_AUTH_SCHEME:-Bearer}
      PROVIDER_API_KEY_ENV_VAR: BLUE_PROVIDER_API_KEY
