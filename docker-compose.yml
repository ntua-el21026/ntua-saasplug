x-backend-healthcheck: &backend-healthcheck
  test:
    - CMD
    - python
    - -c
    - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 20s

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

services:
  frontend:
    container_name: frontend
    build:
      context: ./apps/frontend
      args:
        VITE_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    networks:
      - saasplug-network
    expose:
      - "5173"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O - http://127.0.0.1:5173/health >/dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nginx-gateway:
    container_name: nginx-gateway
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      provider-registry-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      status-service:
        condition: service_healthy
      reservation-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      scheduler-service:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - saasplug-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  auth-service:
    container_name: auth-service
    build:
      context: ./services/auth-service
    environment:
      SERVICE_NAME: auth-service
      APP_ENV: ${APP_ENV:-development}
      SAASPLUG_STRICT_SECRETS: ${SAASPLUG_STRICT_SECRETS:-false}
      DATABASE_URL: ${AUTH_DATABASE_URL:-postgresql://saasplug:saasplug@auth-postgres:5432/auth}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-env}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-change-me-demo-password}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-replace-me}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-replace-me}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/api/auth/auth/google/callback}
      GOOGLE_FRONTEND_CALLBACK_URI: ${GOOGLE_FRONTEND_CALLBACK_URI:-http://localhost:8080/login/google/callback}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
    depends_on:
      auth-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - saasplug-network
    expose:
      - "8000"
    healthcheck: *backend-healthcheck

  provider-registry-service:
    container_name: provider-registry-service
    build:
      context: ./services/provider-registry-service
    environment:
      SERVICE_NAME: provider-registry-service
      APP_ENV: ${APP_ENV:-development}
      SAASPLUG_STRICT_SECRETS: ${SAASPLUG_STRICT_SECRETS:-false}
      DATABASE_URL: ${PROVIDER_REGISTRY_DATABASE_URL:-postgresql://saasplug:saasplug@provider-registry-postgres:5432/provider_registry}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-env}
      PROVIDER_API_TIMEOUT_SECONDS: ${PROVIDER_API_TIMEOUT_SECONDS:-10}
      RED_PROVIDER_BASE_URL: ${RED_PROVIDER_BASE_URL:-https://davinci.softlab.ntua.gr/saas26/redPlug/api}
      GREEN_PROVIDER_BASE_URL: ${GREEN_PROVIDER_BASE_URL:-https://davinci.softlab.ntua.gr/saas26/greenPlug/api}
      BLUE_PROVIDER_BASE_URL: ${BLUE_PROVIDER_BASE_URL:-https://davinci.softlab.ntua.gr/saas26/bluePlug/api}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
