    build:
      context: .
      dockerfile: services/catalog-service/Dockerfile
    environment:
      SERVICE_NAME: catalog-service
      APP_ENV: ${APP_ENV:-development}
      SAASPLUG_STRICT_SECRETS: ${SAASPLUG_STRICT_SECRETS:-false}
      DATABASE_URL: ${CATALOG_DATABASE_URL:-postgresql://saasplug:saasplug@catalog-postgres:5432/catalog}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      RABBITMQ_EVENT_EXCHANGE: ${RABBITMQ_EVENT_EXCHANGE:-saasplug.events}
      RABBITMQ_PUBLISH_TIMEOUT_SECONDS: ${RABBITMQ_PUBLISH_TIMEOUT_SECONDS:-5}
      CATALOG_RABBITMQ_EVENT_PUBLISH_ENABLED: ${CATALOG_RABBITMQ_EVENT_PUBLISH_ENABLED:-true}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-env}
      RED_PROVIDER_SERVICE_URL: ${RED_PROVIDER_SERVICE_URL:-http://red-provider-service:8000}
      GREEN_PROVIDER_SERVICE_URL: ${GREEN_PROVIDER_SERVICE_URL:-http://green-provider-service:8000}
      BLUE_PROVIDER_SERVICE_URL: ${BLUE_PROVIDER_SERVICE_URL:-http://blue-provider-service:8000}
      STATUS_SERVICE_URL: ${STATUS_SERVICE_URL:-http://status-service:8000}
      CATALOG_PROVIDER_HTTP_TIMEOUT_SECONDS: ${CATALOG_PROVIDER_HTTP_TIMEOUT_SECONDS:-10}
      CATALOG_STATUS_SEED_TIMEOUT_SECONDS: ${CATALOG_STATUS_SEED_TIMEOUT_SECONDS:-5}
