      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      RABBITMQ_EVENT_EXCHANGE: ${RABBITMQ_EVENT_EXCHANGE:-saasplug.events}
      RABBITMQ_PUBLISH_TIMEOUT_SECONDS: ${RABBITMQ_PUBLISH_TIMEOUT_SECONDS:-5}
      RABBITMQ_TOPOLOGY_DECLARE_ON_STARTUP: ${RABBITMQ_TOPOLOGY_DECLARE_ON_STARTUP:-false}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-env}
      RESERVATION_CATALOG_SERVICE_URL: ${RESERVATION_CATALOG_SERVICE_URL:-http://catalog-service:8000}
      RESERVATION_PROVIDER_TIMEOUT_SECONDS: ${RESERVATION_PROVIDER_TIMEOUT_SECONDS:-5}
      RESERVATION_OUTBOX_PUBLISH_BATCH_SIZE: ${RESERVATION_OUTBOX_PUBLISH_BATCH_SIZE:-50}
      SCHEDULER_INTERNAL_TOKEN: ${SCHEDULER_INTERNAL_TOKEN:-change-me-scheduler-token}
      RED_PROVIDER_SERVICE_URL: ${RED_PROVIDER_SERVICE_URL:-http://red-provider-service:8000}
      GREEN_PROVIDER_SERVICE_URL: ${GREEN_PROVIDER_SERVICE_URL:-http://green-provider-service:8000}
      BLUE_PROVIDER_SERVICE_URL: ${BLUE_PROVIDER_SERVICE_URL:-http://blue-provider-service:8000}
    depends_on:
      reservation-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - saasplug-network
    expose:
      - "8000"
    healthcheck: *backend-healthcheck

  analytics-service:
    container_name: analytics-service
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    environment:
      SERVICE_NAME: analytics-service
      APP_ENV: ${APP_ENV:-development}
      SAASPLUG_STRICT_SECRETS: ${SAASPLUG_STRICT_SECRETS:-false}
      DATABASE_URL: ${ANALYTICS_DATABASE_URL:-postgresql://saasplug:saasplug@analytics-postgres:5432/analytics}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      RABBITMQ_EVENT_EXCHANGE: ${RABBITMQ_EVENT_EXCHANGE:-saasplug.events}
      ANALYTICS_RABBITMQ_CONSUME_BATCH_SIZE: ${ANALYTICS_RABBITMQ_CONSUME_BATCH_SIZE:-50}
      ANALYTICS_RABBITMQ_CONSUME_TIMEOUT_SECONDS: ${ANALYTICS_RABBITMQ_CONSUME_TIMEOUT_SECONDS:-5}
      ANALYTICS_RABBITMQ_TOPOLOGY_DECLARE_ON_STARTUP: ${ANALYTICS_RABBITMQ_TOPOLOGY_DECLARE_ON_STARTUP:-false}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-env}
      SCHEDULER_INTERNAL_TOKEN: ${SCHEDULER_INTERNAL_TOKEN:-change-me-scheduler-token}
    depends_on:
      analytics-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - saasplug-network
    expose:
      - "8000"
    healthcheck: *backend-healthcheck

  billing-service:
    container_name: billing-service
    build:
      context: .
      dockerfile: services/billing-service/Dockerfile
    environment:
      SERVICE_NAME: billing-service
      APP_ENV: ${APP_ENV:-development}
      SAASPLUG_STRICT_SECRETS: ${SAASPLUG_STRICT_SECRETS:-false}
      DATABASE_URL: ${BILLING_DATABASE_URL:-postgresql://saasplug:saasplug@billing-postgres:5432/billing}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
      RABBITMQ_EVENT_EXCHANGE: ${RABBITMQ_EVENT_EXCHANGE:-saasplug.events}
      RABBITMQ_PUBLISH_TIMEOUT_SECONDS: ${RABBITMQ_PUBLISH_TIMEOUT_SECONDS:-5}
      BILLING_RABBITMQ_CONSUME_BATCH_SIZE: ${BILLING_RABBITMQ_CONSUME_BATCH_SIZE:-50}
      BILLING_RABBITMQ_CONSUME_TIMEOUT_SECONDS: ${BILLING_RABBITMQ_CONSUME_TIMEOUT_SECONDS:-5}
      BILLING_RABBITMQ_TOPOLOGY_DECLARE_ON_STARTUP: ${BILLING_RABBITMQ_TOPOLOGY_DECLARE_ON_STARTUP:-false}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-env}
      BILLING_DEFAULT_CURRENCY: ${BILLING_DEFAULT_CURRENCY:-EUR}
      BILLING_DEFAULT_RESERVATION_SUCCESS_FEE: ${BILLING_DEFAULT_RESERVATION_SUCCESS_FEE:-0.50}
      BILLING_DEFAULT_POINT_VIEW_FEE: ${BILLING_DEFAULT_POINT_VIEW_FEE:-0.01}
      BILLING_DEFAULT_POINT_VIEW_FEE_ENABLED: ${BILLING_DEFAULT_POINT_VIEW_FEE_ENABLED:-true}
      BILLING_DEFAULT_RESERVATION_FAILURE_FEE: ${BILLING_DEFAULT_RESERVATION_FAILURE_FEE:-0.00}
      SCHEDULER_INTERNAL_TOKEN: ${SCHEDULER_INTERNAL_TOKEN:-change-me-scheduler-token}
    depends_on:
      billing-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - saasplug-network
    expose:
      - "8000"
    healthcheck: *backend-healthcheck

  scheduler-service:
    container_name: scheduler-service
    build:
      context: .
      dockerfile: services/scheduler-service/Dockerfile
    environment:
      SERVICE_NAME: scheduler-service
      APP_ENV: ${APP_ENV:-development}
      SAASPLUG_STRICT_SECRETS: ${SAASPLUG_STRICT_SECRETS:-false}
      SCHEDULER_DATABASE_URL: ${SCHEDULER_DATABASE_URL:-postgresql://saasplug:saasplug@scheduler-postgres:5432/scheduler}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-local-env}
      SCHEDULER_TICK_SECONDS: ${SCHEDULER_TICK_SECONDS:-15}
      SCHEDULER_MAX_CONCURRENT_JOBS: ${SCHEDULER_MAX_CONCURRENT_JOBS:-2}
      SCHEDULER_INSTANCE_ID: ${SCHEDULER_INSTANCE_ID:-scheduler-service-1}
      SCHEDULER_INTERNAL_TOKEN: ${SCHEDULER_INTERNAL_TOKEN:-change-me-scheduler-token}
      SCHEDULER_HTTP_TIMEOUT_SECONDS: ${SCHEDULER_HTTP_TIMEOUT_SECONDS:-10}
      SCHEDULER_RUN_LOOP: ${SCHEDULER_RUN_LOOP:-true}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog-service:8000}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL:-http://analytics-service:8000}
      BILLING_SERVICE_URL: ${BILLING_SERVICE_URL:-http://billing-service:8000}
      RESERVATION_SERVICE_URL: ${RESERVATION_SERVICE_URL:-http://reservation-service:8000}
    depends_on:
      scheduler-postgres:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      billing-service:
        condition: service_healthy
      reservation-service:
        condition: service_healthy
    networks:
      - saasplug-network
    expose:
      - "8000"
    healthcheck: *backend-healthcheck

  rabbitmq:
    container_name: rabbitmq
    image: rabbitmq:3-management
    user: root
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-saasplug-local-cookie}
    entrypoint:
      - sh
      - -lc
      - |
        rm -f /var/lib/rabbitmq/.erlang.cookie
        printf '%s' "$$RABBITMQ_ERLANG_COOKIE" > /var/lib/rabbitmq/.erlang.cookie
        chown -R rabbitmq:rabbitmq /var/lib/rabbitmq
        chmod 400 /var/lib/rabbitmq/.erlang.cookie
        exec gosu rabbitmq /usr/local/bin/docker-entrypoint.sh rabbitmq-server
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - saasplug-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 180s

  auth-postgres:
    container_name: auth-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saasplug}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saasplug}
      POSTGRES_DB: auth
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    networks:
      - saasplug-network
    healthcheck: *postgres-healthcheck

  provider-registry-postgres:
