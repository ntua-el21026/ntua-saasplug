    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saasplug}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saasplug}
      POSTGRES_DB: provider_registry
    volumes:
      - provider-registry-postgres-data:/var/lib/postgresql/data
    networks:
