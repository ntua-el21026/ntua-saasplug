map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend_upstream http://frontend:5173;
    set $auth_service_upstream http://auth-service:8000;
    set $provider_registry_service_upstream http://provider-registry-service:8000;
    set $catalog_service_upstream http://catalog-service:8000;
    set $status_service_upstream http://status-service:8000;
    set $reservation_service_upstream http://reservation-service:8000;
    set $analytics_service_upstream http://analytics-service:8000;
    set $billing_service_upstream http://billing-service:8000;
    set $scheduler_service_upstream http://scheduler-service:8000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"service":"nginx-gateway","status":"healthy"}';
    }

    location /api/auth/ {
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass $auth_service_upstream;
    }

    location /api/provider-registry/ {
        rewrite ^/api/provider-registry/(.*)$ /$1 break;
        proxy_pass $provider_registry_service_upstream;
    }

    location /api/providers/ {
        rewrite ^/api/providers/(.*)$ /$1 break;
        proxy_pass $provider_registry_service_upstream;
    }

    # Internal job endpoints are scheduler-only Docker-network routes.
    # Return 404 at the gateway so these service internals are not discoverable.
    location ^~ /api/catalog/internal/ {
        return 404;
    }

    location /api/catalog/ {
        rewrite ^/api/catalog/(.*)$ /$1 break;
        proxy_pass $catalog_service_upstream;
    }

    location /api/status/ {
        rewrite ^/api/status/(.*)$ /$1 break;
        proxy_pass $status_service_upstream;
    }

    location ^~ /api/reservations/internal/ {
        return 404;
    }

    location /api/reservations/ {
        rewrite ^/api/reservations/(.*)$ /$1 break;
        proxy_pass $reservation_service_upstream;
    }

    location ^~ /api/analytics/internal/ {
        return 404;
    }

    location /api/analytics/ {
        rewrite ^/api/analytics/(.*)$ /$1 break;
        proxy_pass $analytics_service_upstream;
    }

    location ^~ /api/billing/internal/ {
        return 404;
    }

    location /api/billing/ {
        rewrite ^/api/billing/(.*)$ /$1 break;
        proxy_pass $billing_service_upstream;
    }

    location /api/scheduler/ {
        rewrite ^/api/scheduler/(.*)$ /$1 break;
        proxy_pass $scheduler_service_upstream;
    }

    location / {
        proxy_pass $frontend_upstream;
    }
}
