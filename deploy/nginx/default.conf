map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
}

upstream frontend_upstream {
    server frontend:5173;
}

upstream auth_service_upstream {
    server auth-service:8000;
}

upstream provider_registry_service_upstream {
    server provider-registry-service:8000;
}

upstream catalog_service_upstream {
    server catalog-service:8000;
}

upstream status_service_upstream {
    server status-service:8000;
}

upstream reservation_service_upstream {
    server reservation-service:8000;
}

upstream analytics_service_upstream {
    server analytics-service:8000;
}

upstream billing_service_upstream {
    server billing-service:8000;
}

upstream scheduler_service_upstream {
    server scheduler-service:8000;
}

server {
    listen 80;
    server_name _;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"service":"nginx-gateway","status":"healthy"}';
    }

    location /api/auth/ {
        proxy_pass http://auth_service_upstream/;
    }

    location /api/provider-registry/ {
        proxy_pass http://provider_registry_service_upstream/;
    }

    location /api/providers/ {
        proxy_pass http://provider_registry_service_upstream/;
    }

    # Internal job endpoints are scheduler-only Docker-network routes.
    # Return 404 at the gateway so these service internals are not discoverable.
    location ^~ /api/catalog/internal/ {
        return 404;
    }

    location /api/catalog/ {
        proxy_pass http://catalog_service_upstream/;
    }

    location /api/status/ {
        proxy_pass http://status_service_upstream/;
    }

    location ^~ /api/reservations/internal/ {
        return 404;
    }

    location /api/reservations/ {
        proxy_pass http://reservation_service_upstream/;
    }

    location ^~ /api/analytics/internal/ {
        return 404;
    }

    location /api/analytics/ {
        proxy_pass http://analytics_service_upstream/;
    }

    location ^~ /api/billing/internal/ {
        return 404;
    }

    location /api/billing/ {
        proxy_pass http://billing_service_upstream/;
    }

    location /api/scheduler/ {
        proxy_pass http://scheduler_service_upstream/;
    }

    location / {
        proxy_pass http://frontend_upstream;
    }
}
